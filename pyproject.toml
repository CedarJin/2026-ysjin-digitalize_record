[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-record-digitizer"
version = "0.7.0"
description = "Evidence-preserving digitization and human review of handwritten food records"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4", "pypdf>=5,<7",
  "openpyxl>=3.1,<4", "httpx>=0.27,<1", "pillow>=11",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
desktop = ["pyinstaller==6.22.3", "pypdfium2==5.14.0"]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
food-record = "food_record_digitizer.cli:main"
[project.gui-scripts]
food-record-reviewer = "food_record_digitizer.offline_web:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
food_record_digitizer = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
